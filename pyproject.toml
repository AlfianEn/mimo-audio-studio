[project]
name = "mimo-audio-studio"
version = "0.1.0"
description = "Full audio AI toolkit powered by Xiaomi MiMo — voice cloning, voice design, TTS, transcription, and summarization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
